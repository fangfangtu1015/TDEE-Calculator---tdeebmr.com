<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<title>Page Not Found - TDEEBMR</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/style.css">
<style>
.error-page { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 60px 24px; }
.error-code { font-size: 8rem; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 16px; }
.error-page h1 { font-size: 1.8rem; margin-bottom: 12px; }
.error-page p { color: var(--text-light); margin-bottom: 24px; max-width: 480px; margin-left: auto; margin-right: auto; }
.error-links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.error-links a { padding: 12px 24px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.95rem; }
.error-links .primary { background: var(--primary); color: white; }
.error-links .secondary { border: 2px solid var(--border); color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="/" class="logo">TDEE<span>BMR</span></a>
    <button class="mobile-menu-btn" aria-label="Toggle menu">&#9776;</button>
    <nav>
      <a href="/calculators/">Calculators</a>
      <a href="/learn/">Learn</a>
      <a href="/methodology/">Methodology</a>
      <a href="/about/">About</a>
    </nav>
  </div>
</header>

<div class="error-page">
  <div>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <div class="error-links">
      <a href="/" class="primary">Go to Calculator</a>
      <a href="/calculators/" class="secondary">All Calculators</a>
      <a href="/learn/" class="secondary">Learn</a>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <div class="footer-bottom">
      &copy; 2026 TDEEBMR. All rights reserved. For educational purposes only.
    </div>
  </div>
</footer>
</body>
</html>
